[pytest]
# app 폴더를 맨 앞에 두어 python main.py 와 같은 방식(from models import ...)으로 불러온다. tests 패키지는 back 폴더에서 찾는다
pythonpath = app .
testpaths = tests
# 실제 모델 호출 테스트는 비용이 드므로 기본에서 뺀다. 돌릴 때: pytest -m live
markers =
    live: 실제 OpenAI·Claude API를 부르는 테스트 (OPENAI_API_KEY 또는 ANTHROPIC_API_KEY 필요, 키가 없는 쪽은 건너뛴다)
addopts = -m "not live"
